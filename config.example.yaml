# Video Context MCP 统一配置文件模板
# 复制为 config.yaml 使用。所有字段均可被同名外部环境变量覆盖：
# 优先级：单次工具入参 > 启动参数 > 外部环境变量 (ENV) > config.yaml > 内置默认值

output:
  # MCP 请求产生的所有产物与拼图根目录（相对路径基于项目根目录解析）
  # 环境变量: VIDEO_CONTEXT_OUTPUT_DIR
  dir: "./output"

  # 抽帧拼图完成后是否保留 cache/ 下的临时视频/音频流（默认 false 用完即删，避免占用磁盘）
  # 环境变量: VIDEO_CONTEXT_KEEP_VIDEO_CACHE
  keep_video_cache: false

runtime:
  # 下载、转码、云端 ASR 与抽帧拼图的全局统一后台总超时上限（秒，默认 300s = 5 分钟）
  # 环境变量: VIDEO_CONTEXT_TIMEOUT_SEC
  timeout_sec: 300

  # 单次 MCP 工具调用主动回执等待窗口（秒，默认 38s，留足 12s 余量避开常见聚合网关 50s 硬截断；设为 0 则单次阻塞等待至 timeout_sec）
  # 超过该窗口而后台仍在 300s 预算内正常运行时，主动返回 RUNNING_IN_BACKGROUND 进度引导模型无缝续接等待
  # 环境变量: VIDEO_CONTEXT_RPC_WAIT_SEC
  rpc_wait_sec: 38

auth:
  # Bilibili 登录 Cookie（获取 AI 字幕 ai-zh 与 >=480p 视频流必填）
  # 支持直接粘贴浏览器请求头 Cookie 字符串 (buvid3=...; SESSDATA=...) 或多行 Netscape 格式文本
  # 环境变量: BILIBILI_COOKIE
  bilibili_cookie: ""

  # 未配置 Bilibili Cookie 时是否允许降级为 360p 无 AI 字幕游客模式（默认 false 阻断提示）
  # 环境变量: VIDEO_CONTEXT_ALLOW_GUEST
  allow_guest_degraded: false

asr:
  # 当在线视频无任何可用字幕，或传入带音轨的本地视频文件时，强制使用此处显式指定的唯一 ASR 渠道
  # 必须显式填写下方 providers 中的渠道名（如 "siliconflow" | "mimo" | "cloudflare" 或自定义槽位名）；留空时若触发 ASR 将直接报错阻断
  # 环境变量: VIDEO_CONTEXT_ASR_PROVIDER
  provider: ""

  # 识别语言提示（"auto" 为自动识别，或填 "zh" / "en" / "ja" / "yue" 等 ISO 语言代码）
  # 环境变量: VIDEO_CONTEXT_ASR_LANGUAGE
  language: "auto"

  # 可选热词/上下文提示词（适用于支持 initial_prompt / prompt 的模型）
  # 环境变量: VIDEO_CONTEXT_ASR_PROMPT
  prompt: ""

  # 安全护栏：单视频允许执行云端 ASR 的最大时长（秒，默认 7200 = 2 小时）
  # 环境变量: VIDEO_CONTEXT_ASR_MAX_DURATION_SEC
  max_duration_sec: 7200

  # 分片并发请求数（默认 2，配合后台检查点温和防限流）、单分片 HTTP 超时上限（秒）与固定失败重试次数
  # 环境变量: VIDEO_CONTEXT_ASR_CONCURRENCY / VIDEO_CONTEXT_ASR_REQUEST_TIMEOUT_SEC / VIDEO_CONTEXT_ASR_MAX_RETRIES
  concurrency: 2
  request_timeout_sec: 300
  max_retries: 2

  # 可同时保存多个渠道的凭证，实际请求严格只走上方 asr.provider 指定的唯一渠道
  # 也支持按三种协议（openai-transcriptions | openai-chat-audio | cloudflare）自行新增自定义渠道名（如 groq / stepfun）
  providers:
    # 1) openai-transcriptions 协议：硅基流动（免费 SenseVoiceSmall，亦可改为 Qwen/Qwen3-ASR-1.7B 等）
    siliconflow:
      # 环境变量: SILICONFLOW_PROTOCOL / SILICONFLOW_BASE_URL / SILICONFLOW_ENDPOINT_PATH / SILICONFLOW_API_KEY / SILICONFLOW_MODEL / SILICONFLOW_RESPONSE_FORMAT
      protocol: "openai-transcriptions"
      base_url: "https://api.siliconflow.cn/v1"
      endpoint_path: "/audio/transcriptions"
      api_key: ""
      model: "FunAudioLLM/SenseVoiceSmall"
      response_format: ""
      auth_header: "Authorization"
      auth_prefix: "Bearer "

    # 2) openai-chat-audio 协议：小米 MiMo 开放平台（mimo-v2.5-asr）
    mimo:
      # 环境变量: MIMO_PROTOCOL / MIMO_BASE_URL / MIMO_ENDPOINT_PATH / MIMO_API_KEY / MIMO_MODEL / MIMO_AUDIO_DATA_STYLE / MIMO_INCLUDE_ASR_OPTIONS
      protocol: "openai-chat-audio"
      base_url: "https://api.xiaomimimo.com/v1"
      endpoint_path: "/chat/completions"
      api_key: ""
      model: "mimo-v2.5-asr"
      audio_data_style: "data_url"
      user_prompt: ""
      include_asr_options: true
      auth_header: "Authorization"
      auth_prefix: "Bearer "

    # 3) cloudflare 协议：Cloudflare Workers AI（每日免费 10,000 Neurons，必填 account_id 与 api_key）
    cloudflare:
      # 环境变量: CLOUDFLARE_PROTOCOL / CLOUDFLARE_BASE_URL / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_KEY / CLOUDFLARE_MODEL / CLOUDFLARE_VAD_FILTER
      protocol: "cloudflare"
      base_url: "https://api.cloudflare.com/client/v4"
      account_id: ""
      api_key: ""
      model: "@cf/openai/whisper-large-v3-turbo"
      payload_mode: "base64_json"
      vad_filter: true

sampling:
  # 灰度探针流采样帧率（默认 2.5 fps，即每 0.4s 扫描一次画面状态）
  # 环境变量: VIDEO_CONTEXT_PROBE_FPS
  probe_fps: 2.5

  # 第一道栅栏：8x6 局部块相对上一入选帧的累积视觉变化阈值 (0.04 - 0.60，越小越灵敏)
  # 环境变量: VIDEO_CONTEXT_DIFF_THRESHOLD
  diff_threshold: 0.15

  # 第二道栅栏：动后取静（Settle）帧间稳定阈值 (0.01 - 0.25，低于此值视为翻页/滚动已停稳)
  # 环境变量: VIDEO_CONTEXT_SETTLE_THRESHOLD
  settle_threshold: 0.045

  # 相邻入选帧最小防抖间隔（秒）
  # 环境变量: VIDEO_CONTEXT_MIN_INTERVAL_SEC
  min_interval_sec: 0.8

  # 长时间完全静止画面的最大保底间隔（秒）
  # 环境变量: VIDEO_CONTEXT_MAX_INTERVAL_SEC
  max_interval_sec: 15.0

  # 全局上限：单视频最大抽帧总数（超出时按「视觉变化强度 × 时间间距」自动优选裁剪）
  # 环境变量: VIDEO_CONTEXT_MAX_FRAMES
  max_frames: 180

grid:
  # 网格列数与行数（默认 3x3）
  # 环境变量: VIDEO_CONTEXT_GRID_COLS / VIDEO_CONTEXT_GRID_ROWS
  cols: 3
  rows: 3

  # 单帧内容区宽高（px，Lanczos 等比缩放居中补黑边）
  # 环境变量: VIDEO_CONTEXT_CELL_WIDTH / VIDEO_CONTEXT_CELL_HEIGHT
  cell_width: 640
  cell_height: 360

  # 单帧顶部零遮挡纯黑时间戳栏高度（px）
  # 环境变量: VIDEO_CONTEXT_HEADER_HEIGHT
  header_height: 24

  # 单元格分隔线宽度（px，默认 8px 防止视觉 Patch 跨格串行）与输出 JPEG 质量 (1 - 100)
  # 环境变量: VIDEO_CONTEXT_GRID_GUTTER / VIDEO_CONTEXT_JPEG_QUALITY
  gutter: 8
  jpeg_quality: 85

binaries:
  # 外部依赖二进制路径覆盖（留空则自动从 PATH 及常见路径寻址）
  # 环境变量: YTDLP_PATH / FFMPEG_PATH / FFPROBE_PATH
  yt_dlp: ""
  ffmpeg: ""
  ffprobe: ""
